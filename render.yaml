services:
  - type: web
    name: yks-tracker-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run db:generate && npm run build:api
    startCommand: npm run start:prod --workspace @yks/api
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NODE_ENV
        value: production

